spring.datasource.url=jdbc:mysql://localhost:3306/fantasytennis?autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Berlin
spring.datasource.username=jftse
spring.datasource.password=jftse
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

jftse.rabbitmq.enabled=true
jftse.rabbitmq.queue=q-game
jftse.rabbitmq.exchange=fantasy-messenger
jftse.rabbitmq.binding=system.motd game.messenger.# game.player.#
jftse.rabbitmq.metrics.enabled=true

grpc.server.port=9899

grpc.client.GLOBAL.negotiation-type=plaintext
grpc.client.auth-server.address=static://localhost:9898

# Guardian shield pads: appear 10s after onStart / stage start (not skip-click).
# Official clients without the hook play the fight without seeing pads.
jftse.guardian.shield-pads.enabled=true
jftse.guardian.shield-pads.delay-seconds=10
jftse.guardian.shield-pads.left-x=-40
jftse.guardian.shield-pads.left-z=-40
jftse.guardian.shield-pads.right-x=40
jftse.guardian.shield-pads.right-z=-40
jftse.guardian.shield-pads.radius=15
# Optional path to stroke-quads.zone in a hooked official-client cwd. Empty = no file write.
jftse.guardian.shield-pads.zone-file=
# Official Shield skill index (FieldItem_Skills_Ini3 ID 9 / SkillUse DB id 10).
jftse.guardian.shield-pads.visual-skill-index=9

# Atlantis V2 (map 10 / BOSS_BATTLE_V2). Default off: keep guardian-phase/10/.
# Set true (or env JFTSE_ATLANTIS_V2=true) only after Thewind confirms.
# Restart game-server after changing this; scripts still need -reloadScripts.
jftse.guardian.atlantis.v2.enabled=false
